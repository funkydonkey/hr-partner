<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HR Partner{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ff2d78",
            "secondary": "#00ffcc",
            "tertiary": "#ffe04a",
            "background": "#0a0a12",
            "surface": "#0f0f1a",
            "surface-container": "#141422",
            "surface-container-low": "#111118",
            "surface-container-high": "#1e1e30",
            "surface-container-highest": "#28283e",
            "surface-bright": "#1a1a2e",
            "surface-variant": "#1e1e30",
            "on-surface": "#e8e0f0",
            "on-surface-variant": "#a098b0",
            "on-background": "#e8e0f0",
            "on-primary": "#1a0010",
            "on-secondary": "#001a1a",
            "on-tertiary": "#1a1000",
            "primary-container": "#b3004e",
            "on-primary-container": "#ffe0ec",
            "secondary-container": "#004d3d",
            "on-secondary-container": "#c0fff4",
            "tertiary-container": "#665200",
            "on-tertiary-container": "#fff0c0",
            "inverse-surface": "#e8e0f0",
            "inverse-primary": "#8c0038",
            "outline": "#5a5068",
            "outline-variant": "#302840",
            "error": "#ff4444",
            "error-container": "#3d0f0f",
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem",
          },
          fontFamily: {
            "headline": ["Sora", "sans-serif"],
            "display": ["Sora", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Space Grotesk", "monospace"],
          }
        }
      }
    }
  </script>
  <style>
    .neon-text-primary { text-shadow: 0 0 8px currentColor; }
    .neon-text-secondary { text-shadow: 0 0 8px currentColor; }
    .neon-button {
      box-shadow: inset 0 0 12px rgba(255,45,120,0.1);
      transition: all 0.3s ease;
    }
    .neon-button:hover {
      box-shadow: 0 0 16px rgba(255,45,120,0.4), inset 0 0 12px rgba(255,45,120,0.2);
      text-shadow: 0 0 8px currentColor;
    }
    .glass-card {
      background: rgba(20,20,34,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,45,120,0.3);
      box-shadow: inset 0 0 12px rgba(255,45,120,0.05);
      transition: transform 0.2s ease, border-color 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(0,255,204,0.5);
      box-shadow: inset 0 0 12px rgba(0,255,204,0.1), 0 4px 20px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }
    .cyber-grid {
      background-color: #0a0a12;
      background-image:
        linear-gradient(rgba(30,30,48,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,30,48,0.3) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a12; }
    ::-webkit-scrollbar-thumb { background: #302840; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff2d78; }
    input[type=text], textarea {
      background: rgba(20,20,34,0.8);
      border: 1px solid rgba(255,45,120,0.3);
      color: #e8e0f0;
      border-radius: 0.25rem;
      padding: 8px 12px;
      font-size: 14px;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }
    input[type=text]:focus, textarea:focus {
      border-color: rgba(0,255,204,0.6);
      box-shadow: 0 0 0 2px rgba(0,255,204,0.1);
    }
    input[type=checkbox] { accent-color: #ff2d78; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen cyber-grid flex flex-col">

  <!-- Nav -->
  <nav class="w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-primary/30 shadow-[0_4px_20px_rgba(255,45,120,0.1)] flex justify-between items-center px-6 py-3">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings:'FILL' 1;">terminal</span>
      <a href="/" class="text-xl font-display font-black text-primary italic tracking-tighter drop-shadow-[0_0_8px_rgba(255,45,120,0.8)]">NEON_RECRUIT</a>
    </div>
    <div class="hidden md:flex items-center gap-8 font-headline font-bold uppercase tracking-widest text-sm">
      <a href="/" class="{% if request.url.path == '/' %}text-primary border-b-2 border-primary drop-shadow-[0_0_5px_rgba(255,45,120,0.5)]{% else %}text-on-surface-variant hover:text-secondary{% endif %} pb-1 transition-all duration-300">Dashboard</a>
      <a href="/queries" class="{% if '/queries' in request.url.path %}text-primary border-b-2 border-primary drop-shadow-[0_0_5px_rgba(255,45,120,0.5)]{% else %}text-on-surface-variant hover:text-secondary{% endif %} pb-1 transition-all duration-300">Search Queries</a>
      <a href="/resume/edit" class="{% if request.url.path == '/resume/edit' %}text-primary border-b-2 border-primary drop-shadow-[0_0_5px_rgba(255,45,120,0.5)]{% else %}text-on-surface-variant hover:text-secondary{% endif %} pb-1 transition-all duration-300">My Resume</a>
      <a href="/perf-review/edit" class="{% if '/perf-review' in request.url.path %}text-primary border-b-2 border-primary drop-shadow-[0_0_5px_rgba(255,45,120,0.5)]{% else %}text-on-surface-variant hover:text-secondary{% endif %} pb-1 transition-all duration-300">Perf Review</a>
    </div>
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary hover:drop-shadow-[0_0_8px_rgba(255,45,120,0.6)] cursor-pointer transition-all">notifications</span>
      <span class="material-symbols-outlined text-primary hover:drop-shadow-[0_0_8px_rgba(255,45,120,0.6)] cursor-pointer transition-all">settings</span>
    </div>
  </nav>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
    {% block content %}{% endblock %}
  </main>

</body>
</html>

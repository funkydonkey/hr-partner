<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HR Partner{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f6; margin: 0; color: #111827; }
    nav { background: #1e3a5f; color: white; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 52px; }
    nav a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; font-weight: 500; }
    nav a:hover { color: white; }
    nav .brand { font-weight: 700; font-size: 16px; color: white; margin-right: 16px; }
    .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 16px; }
    .muted { color: #6b7280; font-size: 14px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: background 0.15s; }
    .btn-primary { background: #1e3a5f; color: white; }
    .btn-primary:hover { background: #162d4a; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover { background: #fecaca; }
    .btn-green { background: #dcfce7; color: #166534; }
    .btn-green:hover { background: #bbf7d0; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .alert-success { background: #dcfce7; color: #166534; border-radius: 6px; padding: 10px 16px; font-size: 14px; margin-bottom: 16px; }
    input[type=text], textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 12px; font-size: 14px; outline: none; }
    input[type=text]:focus, textarea:focus { border-color: #1e3a5f; box-shadow: 0 0 0 2px rgba(30,58,95,0.15); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 13px; color: #6b7280; border-bottom: 2px solid #e5e7eb; }
    td { padding: 12px; font-size: 14px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
    tr:hover td { background: #f9fafb; }
    .score-cell { text-align: center; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">HR Partner</a>
    <a href="/">Dashboard</a>
    <a href="/queries">Search Queries</a>
    <a href="/resume/edit">My Resume</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
